name: Release to App Store

# Fires when a semver tag `vX.Y.Z` is pushed (bump the patch +0.0.1 each
# release — the tag drives MARKETING_VERSION and the build number).
#
# Archives the iOS app, exports a signed App Store IPA and uploads it to App
# Store Connect.  MANUAL App Store signing: the Apple Distribution cert is
# imported into a temp keychain and the "Parados App Store CI" provisioning
# profile is installed, then the archive/export sign against them directly.
# (Automatic signing + -allowProvisioningUpdates failed on this account: it
# tries to mint a Development cert and hits the certificate limit.)
#
# Required repo secrets (set via gh; sourced from ~/.apple + the ywesee p12
# folder — never committed):
#   APPLE_CERT_P12_BASE64    base64 of apple_distribution_ios.p12
#   APPLE_CERT_PASSWORD      that .p12's password
#   IOS_APPSTORE_PROFILE     base64 of the IOS_APP_STORE .mobileprovision
#                            (created via the ASC API for com.ywesee.parados)
#   APPLE_API_KEY_P8_BASE64  base64 of the App Store Connect API key (.p8, for altool)
#   APPLE_API_KEY_ID         the key ID
#   APPLE_API_ISSUER_ID      the issuer UUID

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release (e.g. v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Archive + upload to App Store Connect
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: 4B37356EGR
      BUNDLE_ID: com.ywesee.parados
      PROJECT: Parados.xcodeproj
      SCHEME: Parados

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Parse version from tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF##*/}"
          fi
          VERSION="${TAG#v}"
          BUILD="${VERSION##*.}"     # patch component as the build number
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "build=$BUILD"      >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (build $BUILD)"

      - name: Patch MARKETING_VERSION + CURRENT_PROJECT_VERSION
        run: |
          /usr/bin/sed -i '' \
            -e "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = ${{ steps.ver.outputs.version }};/g" \
            -e "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${{ steps.ver.outputs.build }};/g" \
            "$PROJECT/project.pbxproj"
          grep -E "MARKETING_VERSION|CURRENT_PROJECT_VERSION" "$PROJECT/project.pbxproj" | sort -u

      - name: Import signing certificate into a temp keychain
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD:   ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '" ')
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Stage App Store Connect API key
        env:
          API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID:        ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_P8_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

      - name: Install App Store provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_DIR/parados_appstore.mobileprovision"

      # MANUAL App Store signing with the imported Apple Distribution cert +
      # the "Parados App Store CI" profile.  No -allowProvisioningUpdates, so
      # Xcode never tries to mint a Development cert (which fails — the account
      # is at its certificate limit).
      - name: Archive
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Parados.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution: ywesee GmbH (4B37356EGR)" \
            PROVISIONING_PROFILE_SPECIFIER="Parados App Store CI" \
            archive

      - name: Write ExportOptions.plist
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store-connect</string>
              <key>teamID</key><string>${APPLE_TEAM_ID}</string>
              <key>signingStyle</key><string>manual</string>
              <key>signingCertificate</key><string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key><string>Parados App Store CI</string>
              </dict>
              <key>uploadSymbols</key><true/>
              <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Parados.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist

      - name: Upload to App Store Connect
        env:
          API_KEY_ID:    ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          IPA="$(ls build/export/*.ipa | head -1)"
          echo "Uploading $IPA"
          xcrun altool --upload-app \
            -f "$IPA" \
            --type ios \
            --apiKey    "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Create GitHub release with IPA attached
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IPA="$(ls build/export/*.ipa 2>/dev/null | head -1)"
          [ -z "$IPA" ] && { echo "no IPA to attach"; exit 0; }
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --notes "Automated release of ${{ steps.ver.outputs.version }} (build ${{ steps.ver.outputs.build }}) to App Store Connect." \
            "$IPA" \
            || echo "Release may already exist — skipping."

      - name: Tear down keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
